name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - target: web
            os: ubuntu-latest
            artifact: build/web
          - target: linux
            os: ubuntu-latest
            artifact: build/linux/x64/release/bundle
          - target: windows
            os: windows-latest
            artifact: build/windows/x64/runner/Release
          - target: macos
            os: macos-latest
            artifact: build/macos/Build/Products/Release/dotty.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - if: matrix.target == 'android'
        run: flutter build apk --release
      - if: matrix.target == 'web'
        run: flutter build web --release --no-web-resources-cdn
      - if: matrix.target != 'android' && matrix.target != 'web'
        run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: dotty-${{ matrix.target }}
          path: ${{ matrix.artifact }}
